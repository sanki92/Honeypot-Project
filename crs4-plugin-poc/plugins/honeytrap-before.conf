# Request-Phase Detection Rules

# Skip all plugin rules if disabled via config
SecRule &TX:honeytrap-plugin_enabled "@ge 1" \
    "id:9599099,phase:1,pass,nolog,chain"
SecRule TX:honeytrap-plugin_enabled "@eq 0" \
    "ctl:ruleRemoveById=9599100-9599499"


#  TRAP 1: Fake Port Detection 
# Deny traffic on decoy ports; phase:1 required as deny is a no-op in phase:2 under CRS anomaly scoring
SecRule SERVER_PORT "@within 8000 8888" \
    "id:9599100,phase:1,t:none,log,deny,status:403,\
    msg:'HoneyTrap Alert: Traffic on Monitored Port.',\
    setvar:ip.malicious_client=1"


#  TRAP 2: Robots.txt Bait - Access Detection 
# pass here so honeytrap-after.conf can serve the 401 Basic Auth challenge
SecRule REQUEST_FILENAME "^/db_backup\.\d{10}" \
    "id:9599110,phase:1,t:none,log,pass,\
    msg:'HoneyTrap Alert: Disallowed robots.txt Entry Accessed.',\
    logdata:'%{matched_var}',\
    setvar:ip.malicious_client=1"

# Trap 2: Capture Base64-decoded credentials from fake auth challenge
SecRule REQUEST_FILENAME "^/db_backup\.\d{10}" \
    "chain,id:9599111,phase:1,t:none,log,\
    msg:'HoneyTrap Alert: Auth Attempt to Fake Resource.',\
    logdata:'Credentials used: %{matched_var}'"
SecRule REQUEST_HEADERS:Authorization "^Basic (.*)" "chain,capture"
SecRule TX:1 ".*" "t:base64Decode"


#  TRAP 3: Fake HTML Comment - Access Detection 
# Anyone requesting the fake backup file mentioned in injected comments
SecRule REQUEST_FILENAME "@streq /login.php.bak" \
    "id:9599120,phase:1,t:none,log,deny,status:403,\
    msg:'HoneyTrap Alert: Fake HTML Comment Data Used.',\
    setvar:ip.malicious_client=1"


#  TRAP 4: Hidden Form Field - Manipulation Detection 
# Catch anyone who flips the injected hidden "debug" param
SecRule ARGS:debug "!@streq false" \
    "id:9599130,phase:2,t:none,log,deny,status:403,\
    msg:'HoneyTrap Alert: Hidden Form Field Manipulated.',\
    setvar:ip.malicious_client=1"


#  TRAP 5: Fake Cookie - Manipulation Detection 
# Catch anyone who tampers with the injected role cookie
SecRule REQUEST_HEADERS:Cookie "@contains -user_role" \
    "chain,id:9599140,phase:1,t:none,log,deny,status:403,\
    msg:'HoneyTrap Alert: Fake Cookie Data Manipulation'"
SecRule REQUEST_HEADERS:Cookie "!@contains =Admin:0" \
    "setvar:ip.malicious_client=1"
