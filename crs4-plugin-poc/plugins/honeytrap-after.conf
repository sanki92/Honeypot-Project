# Response-Phase Injection Rules

# Skip all plugin rules if disabled via config
SecRule &TX:honeytrap-plugin_enabled "@ge 1" \
    "id:9599499,phase:1,pass,nolog,chain"
SecRule TX:honeytrap-plugin_enabled "@eq 0" \
    "ctl:ruleRemoveById=9599500-9599999"


#  TRAP 2: Robots.txt Bait - Injection 
# Append a timestamped fake path to robots.txt responses
SecRule REQUEST_FILENAME "@streq /robots.txt" \
    "id:9599500,phase:4,t:none,nolog,pass,\
    append:'Disallow: /db_backup.%{time_epoch}/'"

# Trap 2: Serve a 401 with Basic Auth challenge on the fake path
SecRule REQUEST_FILENAME "^/db_backup\.\d{10}" \
    "id:9599510,phase:3,t:none,log,deny,status:401,\
    msg:'HoneyTrap Alert: Fake Auth Challenge Served.',\
    logdata:'%{matched_var}',\
    setvar:ip.malicious_client=1,\
    setenv:basic_auth=1"
Header always set WWW-Authenticate "Basic realm=\"Admin\"" env=basic_auth


#  TRAP 3: Fake HTML Comment - Injection 
# Inject a misleading debug comment into login.html responses
SecRule REQUEST_FILENAME "@streq /login.html" \
    "chain,id:9599520,phase:4,t:none,nolog,pass,\
    setvar:'tx.form_comment_honeytrap=<form action=\"login.html\" method=\"post\">'"
SecRule STREAM_OUTPUT_BODY \
    "@rsub s/%{tx.form_comment_honeytrap}/<!-- DEBUG - the source code for the old login page is login.php.bak -->%{tx.form_comment_honeytrap}/d"


#  TRAP 4: Hidden Form Field - Injection 
# Inject a hidden "debug=false" field into every form
SecRule STREAM_OUTPUT_BODY \
    "@rsub s/<\/form>/<input type=\"hidden\" name=\"debug\" value=\"false\"><\/form>/" \
    "id:9599530,phase:4,t:none,nolog,pass"


#  TRAP 5: Fake Cookie - Injection 
# Piggyback a fake role cookie onto any real Set-Cookie; env= guard prevents firing when no cookie is present
SecRule RESPONSE_HEADERS:Set-Cookie "^(.*?)=" \
    "id:9599540,phase:3,t:none,nolog,pass,capture,\
    setenv:honeytrap_cookie_name=%{tx.1}-user_role"
Header always set Set-Cookie "%{HONEYTRAP_COOKIE_NAME}e=Admin:0" env=HONEYTRAP_COOKIE_NAME
